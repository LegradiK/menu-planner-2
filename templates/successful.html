{% extends 'base.html' %}
{% from '_macros.html' import recipe_item with context %}
{% block title %}Recipe saved{% endblock %}

{% block content %}
<div class="page">
	<div class="alert alert-success alert-center">
		<strong>{{ recipe.name }}</strong> has been saved.
	</div>

	<div class="recipe-list">
		{{ recipe_item(recipe, open=true) }}
	</div>

	<div class="page-actions">
		<a class="btn btn-primary" href="{{ url_for('add_recipes') }}">Add another recipe</a>
		<a class="btn" href="{{ url_for('all_recipes') }}">All recipes</a>
		<a class="btn" href="{{ url_for('get_recipes') }}">Get menu ideas</a>
	</div>
</div>
{% endblock %}
