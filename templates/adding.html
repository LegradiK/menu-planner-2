{% extends 'base.html' %}
{% block title %}Add a recipe{% endblock %}

{% block content %}
<div class="page">
	<h2 class="page-title">Add a recipe</h2>
	<p class="page-subtitle">Fill in the details below. Empty ingredient rows are ignored.</p>

	<form method="POST" action="{{ url_for('add_recipes') }}" id="recipe-form">
		{{ csrf_token() if csrf_token is defined }}

		<div class="form-group">
			<label class="form-label" for="genre">Genre</label>
			<select class="form-select" id="genre" name="genre" required>
				<option value="main">Main</option>
				<option value="dessert">Dessert</option>
				<option value="bread">Bread</option>
			</select>
		</div>

		<div class="form-group">
			<label class="form-label" for="name">Recipe name</label>
			<input type="text" class="form-control" id="name" name="name" placeholder="Enter the recipe name" required>
		</div>

		<div class="form-group">
			<label class="form-label" for="weight" id="weight-label" aria-live="polite">Weight (how many days the food lasts)</label>
			<input type="number" class="form-control" id="weight" name="weight" min="1" placeholder="Enter weight" required>
		</div>

		<fieldset class="form-group ingredients-fieldset">
			<legend class="form-label">Ingredients</legend>
			<div id="ingredients-section">
				{% for n in range(5) %}
					<div class="ingredient-group">
						<input type="number" step="any" class="form-control ingredient-quantity" placeholder="Qty" name="ingredients[{{ n }}][quantity]" aria-label="Quantity" {% if loop.first %}required{% endif %}>
						<input type="text" class="form-control ingredient-measurement" placeholder="Unit (g, tbsp)" name="ingredients[{{ n }}][measurement]" aria-label="Measurement">
						<input type="text" class="form-control ingredient-name" placeholder="Ingredient" name="ingredients[{{ n }}][name]" aria-label="Ingredient name" {% if loop.first %}required{% endif %}>
					</div>
				{% endfor %}
			</div>
			<button type="button" id="add-ingredient" class="btn btn-sm">+ Add another ingredient</button>
		</fieldset>

		<div class="form-group">
			<label class="form-label" for="cuisine">Cuisine</label>
			<input type="text" class="form-control" id="cuisine" name="cuisine" placeholder="Main: Japanese, Italian… / Bread: Sweet, Salty" required>
		</div>

		<div class="form-group">
			<label class="form-label" for="link">Recipe link (optional)</label>
			<input type="url" class="form-control" id="link" name="link" placeholder="https://…">
		</div>

		<div class="form-group">
			<label class="form-label" for="instructions">Instructions (one step per line)</label>
			<textarea class="form-control" id="instructions" name="instructions" rows="7" placeholder="Boil the water&#10;Mix the ingredients" required></textarea>
		</div>

		<div class="form-actions">
			<button type="submit" class="btn btn-primary btn-lg">Save recipe</button>
		</div>
	</form>
</div>

<script>
	(function () {
		const section = document.getElementById('ingredients-section');
		const form = document.getElementById('recipe-form');
		const genreSelect = document.getElementById('genre');
		const weightLabel = document.getElementById('weight-label');

		// Add another empty ingredient row
		document.getElementById('add-ingredient').addEventListener('click', function () {
			const index = section.querySelectorAll('.ingredient-group').length;
			const row = section.querySelector('.ingredient-group').cloneNode(true);
			row.querySelectorAll('input').forEach(function (input) {
				input.value = '';
				input.required = false;
				input.name = input.name.replace(/\[\d+\]/, '[' + index + ']');
			});
			section.appendChild(row);
			row.querySelector('input').focus();
		});

		// Leave out rows with no ingredient name, and renumber the rest
		// (the Flask route stops reading at the first missing number)
		form.addEventListener('submit', function () {
			let next = 0;
			section.querySelectorAll('.ingredient-group').forEach(function (row) {
				const name = row.querySelector('.ingredient-name');
				row.querySelectorAll('input').forEach(function (input) {
					if (!name.value.trim()) {
						input.removeAttribute('name');
					} else {
						input.name = input.name.replace(/\[\d+\]/, '[' + next + ']');
					}
				});
				if (name.value.trim()) {
					next++;
				}
			});
		});

		// Change what "weight" means for each genre
		const labels = {
			bread: 'Weight (how many pieces of bread)',
			dessert: 'Weight (servings or portions)',
			main: 'Weight (how many days the food lasts)'
		};
		function updateWeightLabel() {
			weightLabel.textContent = labels[genreSelect.value] || labels.main;
		}
		genreSelect.addEventListener('change', updateWeightLabel);
		updateWeightLabel();
	})();
</script>
{% endblock %}
